services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: joinme
      POSTGRES_PASSWORD: joinme
      POSTGRES_DB: joinme
    ports:
      # JOINME_DB_PORT changes the host port when 5432 is already taken.
      - "127.0.0.1:${JOINME_DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joinme -d joinme"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:

