openapi: 3.0.3
info:
  title: Campus Pickup API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Check API availability
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /areas/{id}:
    get:
      summary: Load an area and its optional map boundary
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Area; bbox is west,south,east,north derived from its outline or directly attached places, or null when neither exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Area' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Area not found
          content:
            text/plain:
              schema: { type: string }
        '500': { $ref: '#/components/responses/ServerError' }
  /places:
    get:
      summary: Load mapped places in the visible viewport
      description: Public read-only endpoint. Returns at most 1000 places ordered by ID. If truncated is true, zoom in. Antimeridian-crossing bounds are not supported in this first slice.
      parameters:
        - name: bbox
          in: query
          required: true
          description: Four finite numbers in west,south,east,north order. Longitude within -180..180, latitude within -90..90; west must be less than east and south less than north.
          schema: { type: string, example: '74.40,31.46,74.42,31.48' }
      responses:
        '200':
          description: GeoJSON points with place metadata and optional outlines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Places' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
  /events:
    post:
      summary: Create a scheduled event as the configured demo user
      description: Temporary demo identity until sign-in is implemented. Host and status are chosen by the server. The host joins atomically and counts toward capacity. Request body limited to 16 KiB. No automatic retry or idempotency key in this slice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [place_id, title, type, starts_at, capacity]
              properties:
                place_id: { type: string, format: uuid }
                title: { type: string, minLength: 1, maxLength: 200, description: Trimmed; whitespace-only titles are rejected. }
                type: { type: string, enum: [football, cricket] }
                starts_at: { type: string, format: date-time, description: Future RFC3339 timestamp with explicit offset or Z. }
                capacity: { type: integer, minimum: 1, maximum: 2147483647, description: Includes the host. }
      responses:
        '201':
          description: Event and host participation created atomically
          headers:
            Location:
              schema: { type: string }
              description: URL path to the created event.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Selected place no longer exists
          content:
            text/plain:
              schema: { type: string }
        '503':
          description: Demo user or scheduled status is unavailable
          content:
            text/plain:
              schema: { type: string }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      summary: Browse upcoming scheduled events in the visible viewport
      description: Public read-only. Ordered by starts_at then ID, with at most 1000 events. Exact place_counts include matching events beyond the limit; zoom in when truncated. Full events remain visible.
      parameters:
        - name: bbox
          in: query
          required: true
          description: west,south,east,north, with the same finite ordered world bounds as /places.
          schema: { type: string, example: '74.40,31.46,74.42,31.48' }
        - name: type
          in: query
          description: Omit or leave empty for all event types.
          schema: { type: string, enum: [football, cricket, ''] }
      responses:
        '200':
          description: Upcoming scheduled events, exact counts per place, and truncation flag
          content:
            application/json:
              schema:
                type: object
                required: [events, place_counts, truncated]
                properties:
                  events:
                    type: array
                    maxItems: 1000
                    items: { $ref: '#/components/schemas/EventSummary' }
                  place_counts:
                    type: object
                    description: Place UUID to count of matching events, including results beyond the limit.
                    additionalProperties: { type: integer, minimum: 0 }
                  truncated: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
  /events/{id}:
    get:
      summary: Get an event including its participants
      description: Scheduled, cancelled, completed and elapsed events remain accessible by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Event details and participant roster, including the host
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EventSummary'
                  - type: object
                    required: [participants, viewer]
                    properties:
                      viewer:
                        type: object
                        description: Server-configured demo user; not authentication.
                        required: [id, is_host, is_participant]
                        properties:
                          id: { type: string, format: uuid, nullable: true }
                          is_host: { type: boolean }
                          is_participant: { type: boolean }
                      participants:
                        type: array
                        items: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Event not found
          content:
            text/plain:
              schema: { type: string }
        '500': { $ref: '#/components/responses/ServerError' }
  /me/events:
    get:
      summary: List events hosted or joined by the configured demo user
      description: Independent of the map viewport. Upcoming means scheduled and future; Past includes cancelled, completed and elapsed events. Upcoming sorts by start ascending, Past by start descending, with ID as tie breaker. Pages contain at most 50 events. Offset pages reflect live data; refresh from offset zero after mutations.
      parameters:
        - name: section
          in: query
          schema: { type: string, enum: [upcoming, past], default: upcoming }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 2147483597, default: 0 }
      responses:
        '200':
          description: Event summaries and the next offset, or null for the last page
          content:
            application/json:
              schema:
                type: object
                required: [events, next_offset]
                properties:
                  events:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/EventSummary' }
                  next_offset: { type: integer, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { description: Demo user unavailable }
        '500': { $ref: '#/components/responses/ServerError' }
  /events/{id}/cancellation:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Cancel an upcoming event as its host
      description: No request body. Uses the configured demo user. Locks the same event row as participation, verifies ownership, and changes status to the shared cancelled definition. Keeps the event and roster. Host retries on an already cancelled event succeed without another update. Completed or elapsed scheduled events cannot be cancelled. No notifications in this slice.
      responses:
        '204': { description: Cancelled or already cancelled }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Only the host may cancel }
        '404': { description: Event not found }
        '409': { description: Event is completed or has already started }
        '503': { description: Demo user or cancelled status unavailable }
        '500': { $ref: '#/components/responses/ServerError' }
  /events/{id}/participation:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Join an event as the configured demo user
      description: No request body. Locks the event row in a READ COMMITTED transaction, then checks membership, scheduled/future state and available capacity. Already joined is a successful no-op even for full or closed events. Concurrent requests cannot claim the same final spot.
      responses:
        '204': { description: Joined or already participating }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Event not found }
        '409': { description: Event is full or closed for new joins }
        '503': { description: Demo user unavailable }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      summary: Leave an event as the configured demo user
      description: No request body. Locks the same event row. Non-host participants can leave regardless of event status/time. Already absent is a successful no-op. Hosts cannot leave; use the host cancellation endpoint.
      responses:
        '204': { description: Left or already absent }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Event not found }
        '409': { description: Host cannot leave their event }
        '503': { description: Demo user unavailable }
        '500': { $ref: '#/components/responses/ServerError' }
components:
  responses:
    BadRequest:
      description: Invalid ID, bounds, event type or creation fields
      content:
        text/plain:
          schema: { type: string }
    ServerError:
      description: Database request failed
      content:
        text/plain:
          schema: { type: string }
  schemas:
    Boundary:
      type: object
      nullable: true
      description: GeoJSON MultiPolygon in WGS84; positions use longitude,latitude order.
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [MultiPolygon] }
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: number }
    Area:
      type: object
      required: [id, parent_id, name, type, boundary, bbox, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        type: { type: string, enum: [city, district, campus] }
        boundary: { $ref: '#/components/schemas/Boundary' }
        bbox:
          type: array
          nullable: true
          minItems: 4
          maxItems: 4
          items: { type: number }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    Place:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type: { type: string, enum: [Feature] }
        id: { type: string, format: uuid }
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type: { type: string, enum: [Point] }
            coordinates:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: number }
        properties:
          type: object
          required: [id, area_id, name, type, boundary, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            area_id: { type: string, format: uuid }
            name: { type: string }
            type: { type: string, enum: [ground, court, cafe, park] }
            boundary: { $ref: '#/components/schemas/Boundary' }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
    Places:
      type: object
      required: [type, features, truncated]
      properties:
        type: { type: string, enum: [FeatureCollection] }
        truncated: { type: boolean }
        features:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/Place' }
    Person:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
    EventSummary:
      type: object
      required: [id, title, type, starts_at, capacity, host, place, status, participant_count, available_spots, is_full, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        type: { type: string, enum: [football, cricket] }
        starts_at: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, description: Includes the host. }
        host: { $ref: '#/components/schemas/Person' }
        place:
          type: object
          required: [id, name, coordinates]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            coordinates:
              type: array
              description: Longitude then latitude.
              minItems: 2
              maxItems: 2
              items: { type: number }
        status:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
        participant_count: { type: integer, minimum: 0 }
        available_spots: { type: integer, minimum: 0 }
        is_full: { type: boolean }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
