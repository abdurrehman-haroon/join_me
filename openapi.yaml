openapi: 3.0.3
info:
  title: Campus Pickup API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /activities:
    post:
      summary: Deliver client session, discovery, creation, joining and chat activities
      description: Server assigns the configured demo actor. actor_id asserts queue ownership and must match that actor. Maximum 50 rows and 64 KiB; details at most 4 KiB each. Unknown row fields, backend-only actions, invalid targets/details, and times older than seven days or over five minutes ahead are rejected per row. Rows may arrive out of order. Matching retries are accepted unchanged; changed ID/step content conflicts. Earlier accepted rows remain committed if a later database error causes 500; retry unchanged IDs. This endpoint does not authenticate real users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actor_id, activities]
              properties:
                actor_id: { type: string, format: uuid }
                activities:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { $ref: '#/components/schemas/ClientActivity' }
      responses:
        '200':
          description: One result per input row, in input order. Only accepted, rejected and conflict are terminal acknowledgements. A malformed row without a valid ID may return null as its ID.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, status]
                      properties:
                        id: { type: string, format: uuid, nullable: true }
                        status: { type: string, enum: [accepted, rejected, conflict] }
                        error: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Queue actor differs from current server identity; do not reattribute rows }
        '503': { description: Demo identity missing or unavailable }
        '500': { $ref: '#/components/responses/ServerError' }
  /ws:
    get:
      summary: Multiplex realtime subscriptions over WebSocket
      description: Uses the server-owned demo identity. Supports subscribe/unsubscribe/ping commands and subscribed/update/resync/error/pong replies. One connection can subscribe to 32 targets. Target types are event_details and event_messages; target IDs are event UUIDs. Chat requires current membership, rechecked before sending each update. Details updates omit viewer fields. Sequence numbers are decimal strings. See docs/realtime.md for ordering, recovery, limits and proxy configuration.
      responses:
        '101': { description: WebSocket connection established }
        '400': { description: Invalid WebSocket handshake }
        '403': { description: Untrusted browser origin }
        '503': { description: Identity or realtime service unavailable }
  /realtime:
    get:
      summary: Long-poll fallback for environments blocking WebSockets
      description: Without after, returns an initial snapshot immediately. Otherwise waits up to 20 seconds for a newer snapshot or a permission/status change. Details payloads are current event details; chat payloads contain up to 50 messages after the supplied sequence, has_more, can_send and viewer_id. When has_more is true, the frame sequence is the last message in that page. Reissue with the returned sequence. Authorization is checked on every snapshot. Responses are not cached.
      parameters:
        - name: target_type
          in: query
          required: true
          schema: { type: string, enum: [event_details, event_messages] }
        - name: target_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: after
          in: query
          schema: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
      responses:
        '200':
          description: Authoritative snapshot or chat catch-up page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeFrame' }
        '204': { description: No changes before timeout; reconnect the long poll }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Subscription access revoked or denied }
        '404': { description: Target not found }
        '503': { description: Identity or realtime service unavailable }
  /healthz:
    get:
      summary: Check API availability
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /areas/{id}:
    get:
      summary: Load an area and its optional map boundary
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Area; bbox is west,south,east,north derived from its outline or directly attached places, or null when neither exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Area' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Area not found
          content:
            text/plain:
              schema: { type: string }
        '500': { $ref: '#/components/responses/ServerError' }
  /places:
    get:
      summary: Load mapped places in the visible viewport
      description: Public read-only endpoint. Returns at most 1000 places ordered by ID. If truncated is true, zoom in. Antimeridian-crossing bounds are not supported in this first slice.
      parameters:
        - name: bbox
          in: query
          required: true
          description: Four finite numbers in west,south,east,north order. Longitude within -180..180, latitude within -90..90; west must be less than east and south less than north.
          schema: { type: string, example: '74.40,31.46,74.42,31.48' }
      responses:
        '200':
          description: GeoJSON points with place metadata and optional outlines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Places' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
  /events:
    post:
      summary: Create a scheduled event as the configured demo user
      parameters:
        - { $ref: '#/components/parameters/ActivityID' }
        - { $ref: '#/components/parameters/ActivitySession' }
        - { $ref: '#/components/parameters/ActivityInteraction' }
      description: Temporary demo identity until sign-in is implemented. Host and status are chosen by the server. The host joins atomically and counts toward capacity. Request body limited to 16 KiB. Records event_created transactionally. With all three activity headers, X-Activity-ID is an idempotency receipt scoped to the original actor, session, interaction and normalized body. Concurrent identical retries return the original 201/id even after kickoff; changed content/context returns 409. Receipt retention is required for retry safety. Without headers, legacy creation is not idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [place_id, title, type, starts_at, capacity]
              properties:
                place_id: { type: string, format: uuid }
                title: { type: string, minLength: 1, maxLength: 200, description: Trimmed; whitespace-only titles are rejected. }
                type: { type: string, enum: [football, cricket] }
                starts_at: { type: string, format: date-time, description: Future RFC3339 timestamp with explicit offset or Z. }
                capacity: { type: integer, minimum: 1, maximum: 2147483647, description: Includes the host. }
      responses:
        '409': { description: Creation receipt already used with different content or correlation context }
        '201':
          description: Event and host participation created atomically, or original creation replayed
          headers:
            Location:
              schema: { type: string }
              description: URL path to the created event.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Selected place no longer exists
          content:
            text/plain:
              schema: { type: string }
        '503':
          description: Demo user or scheduled status is unavailable
          content:
            text/plain:
              schema: { type: string }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      summary: Browse upcoming scheduled events in the visible viewport
      description: Public read-only. Ordered by starts_at then ID, with at most 1000 events. Exact place_counts include matching events beyond the limit; zoom in when truncated. Full events remain visible.
      parameters:
        - name: bbox
          in: query
          required: true
          description: west,south,east,north, with the same finite ordered world bounds as /places.
          schema: { type: string, example: '74.40,31.46,74.42,31.48' }
        - name: type
          in: query
          description: Omit or leave empty for all event types.
          schema: { type: string, enum: [football, cricket, ''] }
      responses:
        '200':
          description: Upcoming scheduled events, exact counts per place, and truncation flag
          content:
            application/json:
              schema:
                type: object
                required: [events, place_counts, truncated]
                properties:
                  events:
                    type: array
                    maxItems: 1000
                    items: { $ref: '#/components/schemas/EventSummary' }
                  place_counts:
                    type: object
                    description: Place UUID to count of matching events, including results beyond the limit.
                    additionalProperties: { type: integer, minimum: 0 }
                  truncated: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
  /events/{id}:
    patch:
      summary: Edit an upcoming scheduled event as its host
      description: Updates title, start and capacity together. Place/type stay fixed. Uses DEMO_USER_ID and the shared event row lock; capacity cannot fall below the locked participant count. Automatic timestamps are database-owned. Actual changes atomically record event_edited with changed fields and a post-edit snapshot, alongside realtime publication. Unchanged retries record nothing; an intervening edit can make a repeated body a new change. No activity correlation headers or request receipts on this endpoint. Body limit 16 KiB.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, starts_at, capacity]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                starts_at: { type: string, format: date-time }
                capacity: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        '204': { description: Event updated; refresh details and lists }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Only the host can edit }
        '404': { description: Event not found }
        '409': { description: Event closed/started or capacity below participant count }
        '503': { description: Demo user unavailable }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      summary: Get an event including its participants
      description: Scheduled, cancelled, completed and elapsed events remain accessible by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Event details and participant roster, including the host
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EventSummary'
                  - type: object
                    required: [participants, viewer, sequence]
                    properties:
                      sequence: { type: string, pattern: '^(0|[1-9][0-9]*)$', description: Consistent event_details stream position }
                      viewer:
                        type: object
                        description: Server-configured demo user; not authentication.
                        required: [id, is_host, is_participant]
                        properties:
                          id: { type: string, format: uuid, nullable: true }
                          is_host: { type: boolean }
                          is_participant: { type: boolean }
                      participants:
                        type: array
                        items: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: Event not found
          content:
            text/plain:
              schema: { type: string }
        '500': { $ref: '#/components/responses/ServerError' }
  /events/{id}/signup-insights:
    get:
      summary: Read signup insights as the event host
      description: |
        Uses the server-owned demo identity. Available for scheduled, past and cancelled
        events. A separate host-authorized read; never included in shared event or realtime
        payloads. Reading/refreshing records no activity. Responses are no-store.
        Unique players exclude the host; repeat joins count once. A known leave proves
        an earlier signup even if that signup predates tracking. Players left counts distinct
        players with at least one recorded leave, including those who later rejoined.
        First signup uses the earliest known server join or current membership creation.
        Durations are whole seconds since event creation. Null means no recorded evidence.
        First full uses the earliest recorded creation/join/capacity-reduction snapshot at
        capacity, distinguishing initial_capacity, signup and capacity_reduction.
        Current fullness alone does not establish a historical milestone.
        history_complete means a server event_created record exists; legacy history may be
        incomplete and missing untracked joins/leaves/capacity changes cannot be recovered.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Host signup history summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSignupInsights' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Current demo user is not the event host }
        '404': { description: Event not found }
        '503': { description: Demo user not configured }
        '500': { $ref: '#/components/responses/ServerError' }
  /me:
    get:
      summary: Load the configured demo user's basic profile
      description: Uses the same server-owned DEMO_USER_ID as events and chat. No sign-in or user selection yet.
      responses:
        '200':
          description: Saved profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '503': { description: Demo user not configured or missing from database }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      summary: Update the configured demo user's display name
      description: Trims surrounding whitespace; accepts 1–100 Unicode characters on one line. Cannot change ID or timestamps. Database preserves created_at and automatically refreshes updated_at. Repeating the same name is safe. Body limit 4 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Saved profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { description: Demo user not configured or missing from database }
        '500': { $ref: '#/components/responses/ServerError' }
  /me/event-goal:
    put:
      summary: Set or turn off the current user's event goal
      description: |
        Uses server-owned DEMO_USER_ID; callers cannot select a user. Both fields are
        required. Set a positive int32 target and weekly/monthly period, or both to null
        to turn the goal off. One active goal applies to the current and following periods;
        changing it does not create goal history. Repeating the same request is safe.
        Database-owned timestamps preserve created_at and refresh updated_at.
        No new activity is recorded. Body limit 1 KiB; response is no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventGoal' }
      responses:
        '200':
          description: Saved goal settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventGoal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { description: Demo identity not configured or user missing }
        '500': { $ref: '#/components/responses/ServerError' }
  /me/activity:
    get:
      summary: Load the current user's personal activity summary and history
      description: |
        Uses the server-owned DEMO_USER_ID, as /me does; no caller-selected user.
        Month uses the requested IANA timezone, default UTC, through the current time.
        Joined counts distinct non-host events by first known signup (activities plus
        current memberships); rejoining never adds another event or moves it to a later month.
        Hosted uses event creation time. Totals include left/cancelled events, with
        separate current-state counts which may overlap. Sports and top three grounds
        use these same totals. These are signups, not attendance.
        History includes own creation, join, leave and cancellation actions in the period,
        plus current memberships without tracked joins. Old deleted memberships and
        unrecorded actions cannot be reconstructed. Titles, ground names and event status
        reflect current records. History sorts by occurred_at descending, entry_id descending,
        then action. Offset pages reflect live data; refresh from zero after changes.
        participation is independent of period/offset: it supplies the saved goal,
        current local week/month progress, current/previous monthly recap and all-time
        eligible signup counts for milestones. These use scheduled event dates and current
        memberships, excluding hosted/cancelled/left events. Rejoining counts once;
        leaving, cancellation or rescheduling can reduce progress. Upcoming events count.
        Weeks start Monday; local calendar boundaries respect timezone/DST. Hosting in the
        recap is separate and excludes cancelled events. None of these confirm attendance.
        No new activity is recorded by reading this endpoint. Responses are no-store.
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [month, all], default: month }
        - name: timezone
          in: query
          schema: { type: string, default: UTC, example: Asia/Karachi }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 2147483627, default: 0 }
      responses:
        '200':
          description: Personal summary and up to 20 history entries; empty arrays for no data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserActivity' }
        '400': { description: Invalid, repeated or unsupported parameter }
        '503': { description: Demo identity not configured or user missing }
        '500': { $ref: '#/components/responses/ServerError' }
  /me/events:
    get:
      summary: List events hosted or joined by the configured demo user
      description: Independent of the map viewport. Upcoming means scheduled and future; Past includes cancelled, completed and elapsed events. Upcoming sorts by start ascending, Past by start descending, with ID as tie breaker. Pages contain at most 50 events. Offset pages reflect live data; refresh from offset zero after mutations.
      parameters:
        - name: section
          in: query
          schema: { type: string, enum: [upcoming, past], default: upcoming }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 2147483597, default: 0 }
      responses:
        '200':
          description: Event summaries and the next offset, or null for the last page
          content:
            application/json:
              schema:
                type: object
                required: [events, next_offset]
                properties:
                  events:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/EventSummary' }
                  next_offset: { type: integer, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { description: Demo user unavailable }
        '500': { $ref: '#/components/responses/ServerError' }
  /events/{id}/cancellation:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Cancel an upcoming event as its host
      description: No request body. Uses the configured demo user. Locks the same event row as participation, verifies ownership, and changes status to the shared cancelled definition. Keeps the event and roster. Host retries on an already cancelled event succeed without another update. Completed or elapsed scheduled events cannot be cancelled. Atomically records event_cancelled with previous status and the cancellation snapshot, alongside the committed realtime event update; repeated cancellation records nothing. No activity correlation headers on this endpoint. No push notifications.
      responses:
        '204': { description: Cancelled or already cancelled }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Only the host may cancel }
        '404': { description: Event not found }
        '409': { description: Event is completed or has already started }
        '503': { description: Demo user or cancelled status unavailable }
        '500': { $ref: '#/components/responses/ServerError' }
  /events/{id}/participation:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Join an event as the configured demo user
      parameters:
        - { $ref: '#/components/parameters/ActivityID' }
        - { $ref: '#/components/parameters/ActivitySession' }
        - { $ref: '#/components/parameters/ActivityInteraction' }
      description: No request body. Locks the event row in a READ COMMITTED transaction, then checks membership, scheduled/future state and available capacity. Already joined is a successful no-op even for full or closed events. Concurrent requests cannot claim the same final spot. Records participation_joined only on insertion and join_rejected for full/closed outcomes. All three optional activity headers correlate the outcome; replaying a recorded request returns its original outcome, without rejoining after a subsequent leave. A reused receipt with different actor/event/context conflicts.
      responses:
        '204': { description: Joined or already participating }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Event not found }
        '409': { description: Event is full or closed for new joins }
        '503': { description: Demo user unavailable }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      summary: Leave an event as the configured demo user
      parameters:
        - { $ref: '#/components/parameters/ActivityID' }
        - { $ref: '#/components/parameters/ActivitySession' }
        - { $ref: '#/components/parameters/ActivityInteraction' }
      description: No request body. Locks the same event row. Non-host participants can leave regardless of event status/time. Already absent is a successful no-op. Hosts cannot leave; use the host cancellation endpoint. Records participation_left only on deletion; optional activity headers correlate and deduplicate recorded outcomes.
      responses:
        '204': { description: Left or already absent }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Event not found }
        '409': { description: Host cannot leave their event }
        '503': { description: Demo user unavailable }
        '500': { $ref: '#/components/responses/ServerError' }
  /events/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read participant chat as the configured demo user
      description: Current participants only, including host. Cancelled/completed history stays readable. Latest 50 by default; before reads older pages, after reads catch-up pages. All pages return oldest first. Use one cursor only. For after, advance using the last message until has_more is false. Leaving removes access but retains history.
      parameters:
        - name: after_sequence
          in: query
          description: Nonnegative decimal sequence for ordered recovery. Cannot combine with before or after.
          schema: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        - name: before
          in: query
          schema: { type: string }
        - name: after
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Message page and current permission
          content:
            application/json:
              schema:
                type: object
                required: [messages, has_more, can_send, viewer_id, sequence]
                properties:
                  messages:
                    type: array
                    maxItems: 50
                    items: { $ref: '#/components/schemas/Message' }
                  has_more: { type: boolean }
                  can_send: { type: boolean }
                  viewer_id: { type: string, format: uuid }
                  sequence: { type: string, description: Current chat stream position; advance catch-up using individual message sequences }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Not a current participant }
        '404': { description: Event not found }
        '503': { description: Demo identity unavailable }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      summary: Send a message with an idempotent client UUID
      description: Trimmed 1–2000 Unicode characters. Scheduled events allow sending including after kickoff; cancelled/completed are read-only. Retry the same UUID/body after uncertainty. An identical accepted message succeeds even after cancellation. Changed content/event/author with the same UUID returns 409. Sender/timestamps are server-owned. Shares the event lock with leaving and cancellation. New messages atomically record message_sent with an event snapshot and realtime publication; retries add nothing and retain original attribution. Optional activity headers must be supplied together and remain unchanged for that message through retries. No message content is copied into activities.
      parameters:
        - { $ref: '#/components/parameters/ActivityID' }
        - { $ref: '#/components/parameters/ActivitySession' }
        - { $ref: '#/components/parameters/ActivityInteraction' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, body]
              properties:
                id: { type: string, format: uuid }
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '204': { description: Saved or identical retry already saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Not a current participant }
        '404': { description: Event not found }
        '409': { description: Chat read-only or UUID already used }
        '503': { description: Demo identity unavailable }
        '500': { $ref: '#/components/responses/ServerError' }
components:
  parameters:
    ActivityID:
      name: X-Activity-ID
      in: header
      description: Optional nonzero UUID, stable across retries of this business submission. All three activity headers must be supplied together. Distinct from frontend activity IDs/steps. Backend outcomes have a null interaction_step.
      schema: { type: string, format: uuid }
    ActivitySession:
      name: X-Activity-Session
      in: header
      schema: { type: string, format: uuid }
    ActivityInteraction:
      name: X-Activity-Interaction
      in: header
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid ID, bounds, event type or creation fields
      content:
        text/plain:
          schema: { type: string }
    ServerError:
      description: Database request failed
      content:
        text/plain:
          schema: { type: string }
  schemas:
    ClientActivity:
      type: object
      additionalProperties: false
      required: [id, action, session_id, interaction_id, interaction_step, trackable_type, trackable_id, source, occurred_at, details]
      description: Session, discovery, creation/join and chat client contract; other catalogue actions remain disabled. Session starts require id=session_id, null interaction_id/interaction_step/source/trackable_type/trackable_id and empty details. All screen actions require a nonzero interaction_id, positive interaction_step and a source. Creation actions target a place from event_form. Views target an event from place_details/your_events/profile. Join attempts target an event from event_details. Chat openings target an event from event_details with step 1 and zero timing. Chat lifecycle rows target an event from event_chat. Other lifecycle rows target a place from event_form/place_details or an event from event_details. Timed starts/views must be step 1 with zero durations; timed continuations need step >=2. Sport selections and map empties have a null trackable pair and any positive step. Place views target a place from map and require sport, referrer_interaction_id and zero timing. Empty results require sport/empty_kind; map empties have no timing, place empties require timing and empty_kind=no_events. Referrer IDs are correlation context, not trusted proof of attribution. See docs/activities.md for exact action/detail combinations.
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [session_started, sport_filter_selected, place_viewed, empty_results_viewed, event_creation_started, event_creation_submitted, event_viewed, join_attempted, chat_opened, interaction_paused, interaction_resumed, interaction_closed] }
        session_id: { type: string, format: uuid }
        interaction_id: { type: string, format: uuid, nullable: true }
        interaction_step: { type: integer, minimum: 1, maximum: 2147483647, nullable: true }
        trackable_type: { type: string, enum: [event, place], nullable: true }
        trackable_id: { type: string, format: uuid, nullable: true }
        source: { type: string, enum: [map, event_form, event_details, event_chat, place_details, your_events, profile], nullable: true }
        occurred_at: { type: string, format: date-time }
        details:
          type: object
          additionalProperties: false
          description: Session starts require an empty object. Timed activities require elapsed_ms and active_ms with active_ms <= elapsed_ms. Untimed map discovery actions prohibit timing fields. attempt_number required only for submission/join_attempted. snapshot/viewer_role required only for event_viewed. reason required only for pause/close. All other combinations and explicit nulls are rejected.
          properties:
            sport: { type: string, enum: [all, football, cricket], description: Selected discovery filter; required only on discovery actions }
            empty_kind: { type: string, enum: [no_events, no_places], description: Required only on empty_results_viewed; no_places is map-only }
            referrer_interaction_id: { type: string, format: uuid, description: Required on place_viewed, optional on event_viewed; distinct from the current interaction }
            elapsed_ms: { type: integer, minimum: 0, maximum: 9007199254740991 }
            active_ms: { type: integer, minimum: 0, maximum: 9007199254740991 }
            attempt_number: { type: integer, minimum: 1, maximum: 2147483647 }
            viewer_role: { type: string, enum: [host, participant, visitor] }
            reason: { type: string, enum: [app_backgrounded, screen_hidden, dismissed, completed] }
            snapshot:
              type: object
              additionalProperties: false
              required: [participant_count, capacity, starts_at, status]
              properties:
                participant_count: { type: integer, minimum: 0, maximum: 2147483647 }
                capacity: { type: integer, minimum: 1, maximum: 2147483647 }
                starts_at: { type: string, format: date-time }
                status: { type: string, enum: [scheduled, cancelled, completed] }
    RealtimeFrame:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [subscribed, unsubscribed, update, snapshot, resync, error, pong] }
        id: { type: string, format: uuid, nullable: true, description: Outbox update ID when present }
        request_id: { type: string }
        target_type: { type: string, enum: [event_details, event_messages] }
        target_id: { type: string, format: uuid, nullable: true }
        sequence: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        payload: { type: object, description: Event snapshot, individual chat message, or fallback chat page }
        code: { type: string, description: Structured error category }
    HostSignupInsights:
      type: object
      required: [history_complete, unique_players_joined, unique_players_left, first_signup_at, first_signup_seconds, first_full_at, first_full_seconds, first_full_reason]
      properties:
        history_complete: { type: boolean }
        unique_players_joined: { type: integer, minimum: 0 }
        unique_players_left: { type: integer, minimum: 0 }
        first_signup_at: { type: string, format: date-time, nullable: true }
        first_signup_seconds: { type: integer, minimum: 0, nullable: true }
        first_full_at: { type: string, format: date-time, nullable: true }
        first_full_seconds: { type: integer, minimum: 0, nullable: true }
        first_full_reason: { type: string, enum: [signup, capacity_reduction, initial_capacity], nullable: true }
    EventGoal:
      type: object
      additionalProperties: false
      required: [event_goal_target, event_goal_period]
      description: Both fields must be set together or both null.
      properties:
        event_goal_target: { type: integer, minimum: 1, maximum: 2147483647, nullable: true }
        event_goal_period: { type: string, enum: [weekly, monthly], nullable: true }
    ParticipationProgress:
      allOf:
        - type: object
          required: [event_goal_target, event_goal_period]
          properties:
            event_goal_target: { type: integer, minimum: 1, maximum: 2147483647, nullable: true }
            event_goal_period: { type: string, enum: [weekly, monthly], nullable: true }
        - type: object
          required: [goal_progress, goal_starts_at, goal_ends_at, eligible_joined, football_joined, cricket_joined, month_starts_at, month_ends_at, month_joined, previous_month_joined, month_sports, month_grounds, month_hosted]
          properties:
            goal_progress: { type: integer, minimum: 0, description: Uncapped progress; zero when goal is off }
            goal_starts_at: { type: string, format: date-time, nullable: true }
            goal_ends_at: { type: string, format: date-time, nullable: true, description: Exclusive end }
            eligible_joined: { type: integer, minimum: 0 }
            football_joined: { type: integer, minimum: 0 }
            cricket_joined: { type: integer, minimum: 0 }
            month_starts_at: { type: string, format: date-time }
            month_ends_at: { type: string, format: date-time, description: Exclusive end }
            month_joined: { type: integer, minimum: 0 }
            previous_month_joined: { type: integer, minimum: 0 }
            month_sports: { type: integer, minimum: 0 }
            month_grounds: { type: integer, minimum: 0 }
            month_hosted: { type: integer, minimum: 0 }
    UserActivity:
      type: object
      required: [participation, joined, left, cancelled_joined, hosted, cancelled_hosted, sports, grounds, history, next_offset]
      properties:
        participation: { $ref: '#/components/schemas/ParticipationProgress' }
        joined: { type: integer, minimum: 0 }
        left: { type: integer, minimum: 0, description: Joined events without a current membership }
        cancelled_joined: { type: integer, minimum: 0 }
        hosted: { type: integer, minimum: 0 }
        cancelled_hosted: { type: integer, minimum: 0 }
        sports:
          type: array
          items:
            type: object
            required: [type, joined, hosted]
            properties:
              type: { type: string, enum: [football, cricket] }
              joined: { type: integer, minimum: 0 }
              hosted: { type: integer, minimum: 0 }
        grounds:
          type: array
          maxItems: 3
          items:
            type: object
            required: [id, name, events]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              events: { type: integer, minimum: 1 }
        history:
          type: array
          maxItems: 20
          items:
            type: object
            required: [entry_id, action, event_id, occurred_at, title, type, place_name, event_status]
            properties:
              entry_id: { type: string, format: uuid }
              action: { type: string, enum: [event_created, participation_joined, participation_left, event_cancelled] }
              event_id: { type: string, format: uuid }
              occurred_at: { type: string, format: date-time }
              title: { type: string }
              type: { type: string, enum: [football, cricket] }
              place_name: { type: string }
              event_status: { type: string, enum: [scheduled, cancelled, completed] }
        next_offset: { type: integer, nullable: true, minimum: 0 }
    Profile:
      type: object
      required: [id, display_name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Message:
      type: object
      required: [id, event_id, user_id, body, display_name, created_at, updated_at, cursor, sequence]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        body: { type: string }
        display_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        cursor: { type: string }
        sequence: { type: string, pattern: '^[1-9][0-9]*$' }
    Boundary:
      type: object
      nullable: true
      description: GeoJSON MultiPolygon in WGS84; positions use longitude,latitude order.
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [MultiPolygon] }
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: number }
    Area:
      type: object
      required: [id, parent_id, name, type, boundary, bbox, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        type: { type: string, enum: [city, district, campus] }
        boundary: { $ref: '#/components/schemas/Boundary' }
        bbox:
          type: array
          nullable: true
          minItems: 4
          maxItems: 4
          items: { type: number }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    Place:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type: { type: string, enum: [Feature] }
        id: { type: string, format: uuid }
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type: { type: string, enum: [Point] }
            coordinates:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: number }
        properties:
          type: object
          required: [id, area_id, name, type, boundary, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            area_id: { type: string, format: uuid }
            name: { type: string }
            type: { type: string, enum: [ground, court, cafe, park] }
            boundary: { $ref: '#/components/schemas/Boundary' }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
    Places:
      type: object
      required: [type, features, truncated]
      properties:
        type: { type: string, enum: [FeatureCollection] }
        truncated: { type: boolean }
        features:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/Place' }
    Person:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
    EventSummary:
      type: object
      required: [id, title, type, starts_at, capacity, host, place, status, participant_count, available_spots, is_full, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        type: { type: string, enum: [football, cricket] }
        starts_at: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1, description: Includes the host. }
        host: { $ref: '#/components/schemas/Person' }
        place:
          type: object
          required: [id, name, coordinates]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            coordinates:
              type: array
              description: Longitude then latitude.
              minItems: 2
              maxItems: 2
              items: { type: number }
        status:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
        participant_count: { type: integer, minimum: 0 }
        available_spots: { type: integer, minimum: 0 }
        is_full: { type: boolean }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
